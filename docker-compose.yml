version: '3.8'

services:

  # ── Servidor Web Apache + PHP 8.2 ──
  web:
    build: .
    container_name: institut_web
    ports:
      - "8080:80"
    volumes:
      - ./institut:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_net

  # ── Base de dades MariaDB ──
  db:
    image: mariadb:10.6
    container_name: institut_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: institut_montsia
      MYSQL_USER: institut
      MYSQL_PASSWORD: institut1234
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lamp_net

  # ── phpMyAdmin ──
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: institut_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - lamp_net

volumes:
  db_data:

networks:
  lamp_net:
    driver: bridge
